<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0a0b">
  <title>For You ♡</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Inter:wght@400;500;600&family=Oswald:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- first tap: starts the music (browsers need one tap before any sound) -->
  <div class="curtain" id="curtain" hidden>
    <!-- the "screen" behind the drapes: an old film-leader countdown -->
    <div class="leader" id="leader" aria-hidden="true">
      <div class="leader-ring"></div><div class="leader-sweep"></div>
      <i class="leader-h"></i><i class="leader-v"></i>
      <span class="leader-num" id="leader-num">3</span>
    </div>
    <div class="drape drape-l" aria-hidden="true"></div>
    <div class="drape drape-r" aria-hidden="true"></div>
    <div class="valance" aria-hidden="true"></div>
    <button type="button" class="curtain-inner" id="curtain-btn">
      <span class="studio" id="curtain-studio"></span>
      <span class="curtain-title" id="curtain-name">you</span>
      <span class="curtain-tag" id="curtain-tag"></span>
      <span class="curtain-cta">tap to begin <span aria-hidden="true">♪</span></span>
    </button>
  </div>
  <button type="button" class="sound-toggle" id="sound-toggle" aria-label="Mute music" hidden>♪</button>

  <!-- ============ HOME: three posters ============ -->
  <div class="home-bg" id="home-bg" aria-hidden="true"></div>
  <main id="home" class="home">
    <header class="marquee intro">
      <p class="studio" id="m-studio"></p>
      <h1 class="marquee-title" id="m-title"></h1>
      <p class="marquee-tag" id="m-tag"></p>
      <div class="marquee-rule" aria-hidden="true"></div>
      <p class="marquee-sub" id="m-sub"></p>
      <p class="billing" id="m-billing"></p>
      <span class="rating" id="m-rating"></span>
    </header>
    <div class="posters" id="posters"></div>

    <section class="archive" id="archive" hidden>
      <div class="archive-head">
        <p class="eyebrow" id="archive-title"></p>
        <p class="archive-sub" id="archive-sub"></p>
      </div>
      <div class="archive-row" id="archive-row"></div>
    </section>

    <!-- ONE MORE THING: appears once all archives are unlocked; opens at 11:55 PM -->
    <section class="encore" id="encore" hidden>
      <p class="enc-eyebrow" id="enc-eyebrow"></p>
      <h2 class="enc-title" id="enc-title"></h2>
      <p class="enc-sub" id="enc-sub"></p>
      <div class="enc-card" id="enc-card">
        <div class="enc-locked">
          <span class="enc-lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/></svg></span>
          <p class="enc-what" id="enc-what"></p>
          <span class="enc-pill" id="enc-pill"></span>
          <p class="enc-when"><span id="enc-date"></span> · <span id="enc-count"></span></p>
        </div>
        <div class="enc-reveal" aria-live="polite"><p class="enc-r1"></p><p class="enc-r2"></p></div>
        <button class="enc-open" id="enc-open" type="button"><span aria-hidden="true">▶</span> <span id="enc-begin"></span></button>
      </div>
    </section>

    <p class="home-foot">turn your sound on ♪</p>
  </main>

  <!-- archive video player -->
  <div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Video player">
    <div class="player-box">
      <button type="button" class="player-close" id="player-close" aria-label="Close">✕</button>
      <video id="player-video" controls playsinline preload="metadata"></video>
      <p class="player-title" id="player-title"></p>
    </div>
  </div>

  <!-- archive challenge (question / little game) -->
  <div class="challenge" id="challenge" hidden role="dialog" aria-modal="true" aria-labelledby="ch-kicker">
    <div class="ch-box">
      <button type="button" class="player-close ch-close" id="ch-close" aria-label="Close">✕</button>
      <p class="eyebrow" id="ch-kicker"></p>
      <h3 class="ch-prompt" id="ch-prompt"></h3>
      <div class="ch-body" id="ch-body"></div>
      <p class="ch-for" id="ch-for"></p>
    </div>
  </div>

  <!-- ============ PART I ============ -->
  <section class="scene scene-split" id="scene-0" hidden>
    <button class="back" type="button" aria-label="Back to posters">← back</button>
    <div class="hearts" aria-hidden="true"></div>
    <div class="split">
      <div class="split-text">
        <p class="eyebrow reveal-item" id="p1-eyebrow"></p>
        <h2 class="display reveal-item" id="p1-title"></h2>
        <div class="letter prose" id="p1-body" aria-live="polite"></div>
        <div class="letter-nav reveal-item" id="p1-nav">
          <button type="button" class="letter-btn" id="p1-prev" aria-label="Previous page">← </button>
          <div class="letter-dots" id="p1-dots"></div>
          <button type="button" class="letter-btn" id="p1-next">next →</button>
        </div>
      </div>
      <div class="split-media">
        <div class="scratch-wrap" id="scratch-wrap">
          <div class="fan" id="p1-fan"></div>
          <div class="scratch" id="scratch">
            <img id="p1-img" alt="Our first picture together">
            <canvas id="scratch-canvas" aria-label="Scratch to reveal a photo"></canvas>
          </div>
        </div>
        <p class="media-caption" id="p1-caption"></p>
      </div>
    </div>
  </section>

  <!-- ============ PART II ============ -->
  <section class="scene scene-film" id="scene-1" hidden>
    <button class="back" type="button" aria-label="Back to posters">← back</button>
    <div class="film-stage" id="film-stage"></div>
    <div class="film-bokeh" id="film-bokeh" aria-hidden="true"></div>
    <div class="film-vignette" aria-hidden="true"></div>
    <div class="film-leak" id="film-leak" aria-hidden="true"></div>
    <div class="lyric" id="lyric" aria-live="off"><span class="lyric-line"></span><span class="lyric-line"></span></div>
    <div class="film-hud">
      <div class="film-progress"><span id="film-bar"></span></div>
      <div class="film-controls">
        <button type="button" id="film-prev" aria-label="Previous">‹</button>
        <button type="button" id="film-play" aria-label="Pause">❚❚</button>
        <button type="button" id="film-next" aria-label="Next">›</button>
        <button type="button" id="film-cc" class="cc on" aria-label="Lyrics on/off" title="lyrics">CC</button>
      </div>
      <div class="film-time" id="film-time" hidden></div>
    </div>
  </section>

  <!-- ============ PART III ============ -->
  <section class="scene scene-split scene-night" id="scene-2" hidden>
    <button class="back" type="button" aria-label="Back to posters">← back</button>
    <div class="stars" aria-hidden="true"></div>
    <div class="split">
      <div class="split-text reel">
        <div class="reel-stage" id="reel-stage" aria-live="polite"></div>
        <p class="signoff" id="p3-sign"></p>
        <button class="ghost" type="button" id="reel-replay" hidden>play again</button>
      </div>
      <div class="split-media">
        <div class="pola-pile" id="p3-pile">
          <figure class="polaroid p3-main"><img id="p3-img" alt="Us"></figure>
          <figure class="polaroid p3-first" hidden><img id="p3-img2" alt="Us"></figure>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ ONE MORE THING (epilogue) ============ -->
  <section class="scene scene-encore" id="scene-3" hidden>
    <button class="back" type="button" aria-label="Back to the site">← back</button>
    <div class="ep-layer ep-title" id="ep-title"><p class="eyebrow" id="ep-title-eyebrow"></p><h2 id="ep-title-text"></h2></div>
    <div class="ep-layer ep-tn" id="ep-tn">
      <div class="ep-tn-wrap" id="ep-tn-wrap"><img class="ep-then" id="ep-then" alt=""><img class="ep-now" id="ep-now" alt=""></div>
      <div class="ep-tn-cap"><span class="ep-year" id="ep-year"></span><span class="ep-tag" id="ep-tag"></span></div>
      <p class="ep-far" id="ep-far"></p>
    </div>
    <div class="ep-layer ep-inf" id="ep-inf">
      <div class="ep-glyphs"><span class="g8">8</span><span class="ginf">∞</span></div>
      <p class="ep-inf-a" id="ep-inf-a"></p><p class="ep-inf-b" id="ep-inf-b"></p>
    </div>
    <div class="ep-layer ep-msg" id="ep-msg">
      <video id="ep-msg-video" playsinline preload="auto"></video>
      <button class="ghost ep-tap" id="ep-msg-play" type="button" hidden>▶ play</button>
      <div class="ep-msg-bar"><span id="ep-msg-bar"></span></div>
    </div>
    <div class="ep-layer ep-credits" id="ep-credits"><div class="ep-roll" id="ep-roll"></div></div>
    <div class="ep-layer ep-standout" id="ep-standout"><p id="ep-standout-text"></p></div>
    <div class="ep-layer ep-tbc" id="ep-tbc">
      <div class="ep-tbc-card"><h3 id="ep-tbc-title"></h3><p id="ep-tbc-line"></p><span class="ep-tbc-inf">∞</span><p class="ep-tbc-foot" id="ep-tbc-foot"></p></div>
    </div>
    <div class="ep-layer ep-after" id="ep-after">
      <p class="ep-wait" id="ep-wait"></p>
      <button class="ep-after-card" id="ep-after-card" type="button" aria-label="Play the last scene">
        <img id="ep-after-poster" alt="">
        <span class="ep-after-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <span class="ep-after-tap">tap to play</span>
      </button>
      <video id="ep-after-video" muted playsinline preload="auto"></video>
    </div>
    <div class="ep-layer ep-final" id="ep-final">
      <span class="ep-final-inf">∞</span><p id="ep-final-line"></p>
      <div class="ep-final-btns"><button class="ghost" id="ep-again" type="button">play again</button><button class="ghost" id="ep-home" type="button">back to the site</button></div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="assets/music/part2-lyrics.js"></script>
  <script src="app.js"></script>
</body>
</html>
